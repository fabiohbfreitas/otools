<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Utilitário de Dados</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #121212;
            --border: #262626;
            --border-focus: #ffffff;
            --text-main: #e5e5e5;
            --text-muted: #a3a3a3;
            --accent: #ffffff;
            --accent-dim: #f5f5f5;
            --button-sec-bg: #1a1a1a;
            --button-sec-hover: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 13px;
            line-height: 1.5;
            width: 480px;
            padding: 1rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--accent);
        }

        .header-actions {
            display: flex;
            gap: 0.35rem;
        }

        /* Config Grid */
        .config-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            background-color: var(--card-bg);
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem;
            font-family: inherit;
            font-size: 0.8rem;
            border-radius: 4px;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--border-focus);
        }

        /* Export Action Layout */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card-title {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .export-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding-bottom: 0.5rem;
        }

        .export-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .export-label {
            font-weight: 500;
            font-size: 0.8rem;
        }

        .export-buttons {
            display: flex;
            gap: 0.35rem;
        }

        /* Live Preview Table */
        .table-panel {
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
            max-height: 120px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
        }

        th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-main);
            font-weight: 600;
            white-space: nowrap;
        }

        .empty-state {
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Buttons & Actions */
        button.btn {
            background-color: var(--accent);
            color: var(--bg-color);
            border: 1px solid var(--accent);
            border-radius: 4px;
            padding: 0.4rem 0.8rem;
            font-weight: 600;
            font-size: 0.75rem;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button.btn:hover:not(:disabled) {
            background-color: var(--accent-dim);
            border-color: var(--accent-dim);
        }

        button.btn.secondary {
            background-color: var(--button-sec-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        button.btn.secondary:hover:not(:disabled) {
            background-color: var(--button-sec-hover);
            border-color: var(--text-muted);
        }

        button.btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        /* Status Bar */
        .status-container {
            text-align: center;
            min-height: 1.25rem;
        }

        .status {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent);
            transition: color 0.2s;
        }
        .status-success { color: #4ade80; }
        .status-error { color: #f87171; }

        /* Loading Spinner */
        .spinner-container {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            min-height: 1.25rem;
        }
        .spinner-container.visible {
            display: flex;
        }
        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Utilitário de Dados</h1>
        <div class="header-actions">
            <button id="copyHtmlBtn" class="btn secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" disabled>
                📋 Copiar HTML
            </button>
            <button id="refreshBtn" class="btn secondary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">
                🔄 Atualizar
            </button>
        </div>
    </header>

    <!-- Global Configurations -->
    <div class="config-grid">
        <div class="field">
            <label for="refDate">Data da Consulta</label>
            <input type="date" id="refDate">
        </div>
        <div class="field">
            <label for="especialidadeSel">Especialidade</label>
            <select id="especialidadeSel">
                <option value="Ortopedia">Ortopedia</option>
                <option value="Cardiologia">Cardiologia</option>
                <option value="Otorrinolaringologia">Otorrinolaringologia</option>
                <option value="Ginecologia">Ginecologia</option>
                <option value="">(Nenhum)</option>
            </select>
        </div>
        <div class="field">
            <label for="localSel">Local</label>
            <select id="localSel">
                <option value="Samambaia">Samambaia</option>
                <option value="Gama">Gama</option>
                <option value="Sobradinho">Sobradinho</option>
                <option value="">(Nenhum)</option>
            </select>
        </div>
        <div class="field">
            <label for="exportNameInput">Nome do Arquivo</label>
            <input type="text" id="exportNameInput" placeholder="dados_processados">
        </div>
        <div class="field" style="grid-column: span 2;">
            <label for="groupNamesInput">Horários Disponíveis</label>
            <input type="text" id="groupNamesInput" placeholder="10,12,13">
        </div>
    </div>

    <!-- Single Export Action -->
    <div class="card">
        <div class="card-title">Exportar</div>
        <div class="export-row">
            <span class="export-label">Dados para Importação</span>
            <div class="export-buttons">
                <button id="dlImportedCsvBtn" class="btn secondary" disabled>CSV</button>
                <button id="dlImportedXlsxBtn" class="btn" disabled>Excel</button>
            </div>
        </div>
        <div class="export-row">
            <span class="export-label">Dados Completos</span>
            <div class="export-buttons">
                <button id="dlTransformedXlsxBtn" class="btn" disabled>Excel</button>
            </div>
        </div>
    </div>

    <!-- Status Banner -->
    <div class="status-container">
        <div id="loadingContainer" class="spinner-container">
            <div class="spinner"></div>
            <span class="status">Buscando tabelas...</span>
        </div>
        <span id="status" class="status"></span>
    </div>
</div>

<!-- Dependencies -->
<script src="xlsx.mini.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
