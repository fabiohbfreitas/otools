<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Conversor Não Consultados → Importação</title>
<style>
:root {
    --bg: #0a0a0a; --card: #121212; --border: #262626; --border-focus: #fff;
    --text: #e5e5e5; --muted: #a3a3a3; --accent: #fff; --dim: #f5f5f5;
    --sec-bg: #1a1a1a; --sec-hover: #2a2a2a; --success: #4ade80; --error: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5;
    width: 560px; margin: 2rem auto; padding: 1rem;
}
h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 1rem; }
.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 1rem; display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1rem;
}
.field { display: flex; flex-direction: column; gap: .35rem; }
label { font-size: .65rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: .4rem; font-family: inherit; font-size: .8rem; border-radius: 4px;
    outline: none; width: 100%;
}
input:focus { border-color: var(--border-focus); }
button {
    background: var(--accent); color: var(--bg); border: 1px solid var(--accent);
    border-radius: 4px; padding: .4rem .8rem; font-weight: 600; font-size: .75rem;
    cursor: pointer; transition: background .15s, border-color .15s;
}
button:hover:not(:disabled) { background: var(--dim); border-color: var(--dim); }
button:disabled { opacity: .25; cursor: not-allowed; }
button.sec { background: var(--sec-bg); border-color: var(--border); color: var(--text); }
button.sec:hover:not(:disabled) { background: var(--sec-hover); border-color: var(--muted); }
.wrap { overflow-x: auto; max-height: 220px; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: .75rem; }
th, td { padding: .5rem .6rem; border-bottom: 1px solid var(--border); }
th { background: rgba(255,255,255,.02); color: var(--text); font-weight: 600; white-space: nowrap; }
.empty { padding: 1.5rem; text-align: center; color: var(--muted); }
.file-row {
    display: flex; flex-direction: column; gap: .35rem;
    background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: .6rem;
}
.file-row-header { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
.file-name { font-size: .75rem; font-weight: 600; color: var(--text); word-break: break-all; }
button.btn-remove {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: .1rem .4rem; font-size: .65rem; flex-shrink: 0;
}
button.btn-remove:hover:not(:disabled) { background: var(--sec-hover); color: var(--text); }
.summary { font-size: .75rem; color: var(--muted); text-align: center; }
.status { text-align: center; min-height: 1.25rem; font-size: .8rem; font-weight: 500; }
.status-success { color: var(--success); }
.status-error { color: var(--error); }
</style>
</head>
<body>

<h1>Conversor Não Consultados → Importação</h1>

<div class="card">
    <div class="field">
        <label for="csvFile">Arquivos CSV (Paciente, Telefone, Horário, Unidade, Especialidade, ...)</label>
        <input type="file" id="csvFile" accept=".csv" multiple>
    </div>
    <div class="field">
        <label for="refDate">Data do Evento</label>
        <input type="date" id="refDate">
    </div>
    <div id="fileRows"></div>
    <button id="processBtn" class="sec" disabled>Converter</button>
</div>

<div class="card">
    <div class="wrap" id="previewContainer">
        <div class="empty">Carregue um CSV para visualizar a prévia.</div>
    </div>
    <div class="summary" id="summary"></div>
</div>

<div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">
    <button id="dlCsvBtn" class="sec" disabled>CSV</button>
</div>

<div class="status" id="status"></div>

<script>
const LOCATION_CONFIG = {
    Samambaia: { codes: ['0366986'] },
    Gama: { codes: ['9180168'] },
    Sobradinho: { codes: ['3031543', 'ECOGRAFICO'] }
};

const SPECIALTY_CONFIG = {
    Ortopedia: { keywords: ['ORTOPEDIA'] },
    Cardiologia: { keywords: ['CARDIOLOGIA'] },
    Otorrinolaringologia: { keywords: ['OTORRINOLARINGOLOGIA'] },
    Ginecologia: { keywords: ['GINECOLOGIA'] },
    Eletrocardiograma: { keywords: ['ELETROCARDIOGRAMA'] },
    Tomografia: { keywords: ['TOMOGRAFIA'] },
    Reumatologia: { keywords: ['REUMATOLOGIA'] },
    Espirometria: { keywords: ['ESPIROMETRIA'] },
    Mamografia: { keywords: ['MAMOGRAFIA'] },
    RessonanciaMagnetica: { keywords: ['RESSONANCIA MAGNETICA'] }
};

let sources = [];       // [{ file, input }] per selected file
let resultData = [];
let fileSummaries = [];
let statusTimeout;
let conversionToken = 0;

const refDateInput = document.getElementById('refDate');
const today = new Date();
const nextBusiness = new Date(today);
nextBusiness.setDate(nextBusiness.getDate() + 1);
while (nextBusiness.getDay() === 0 || nextBusiness.getDay() === 6) {
    nextBusiness.setDate(nextBusiness.getDate() + 1);
}
refDateInput.value = nextBusiness.toISOString().split('T')[0];

const csvFile = document.getElementById('csvFile');
const fileRowsContainer = document.getElementById('fileRows');
const processBtn = document.getElementById('processBtn');
const previewContainer = document.getElementById('previewContainer');
const summary = document.getElementById('summary');
const dlCsvBtn = document.getElementById('dlCsvBtn');
const statusEl = document.getElementById('status');

csvFile.addEventListener('change', buildSourceRows);

processBtn.addEventListener('click', runConversion);

refDateInput.addEventListener('change', () => {
    if (sources.length) runConversion();
});

function parseGroupNames(input) {
    return (input.value || '').split(',').map(s => s.trim()).filter(Boolean);
}

function buildSourceRows() {
    const files = Array.from(csvFile.files);
    if (!files.length) return;
    sources = files.map(file => ({ file, input: null }));
    csvFile.value = '';
    renderFileRows();
    processBtn.disabled = sources.length === 0;
    resetResults();
    runConversion();
}

function renderFileRows() {
    fileRowsContainer.innerHTML = '';
    sources.forEach((source, index) => {
        const row = document.createElement('div');
        row.className = 'file-row';

        const header = document.createElement('div');
        header.className = 'file-row-header';
        const name = document.createElement('span');
        name.className = 'file-name';
        name.textContent = source.file.name;
        const rmBtn = document.createElement('button');
        rmBtn.className = 'btn-remove';
        rmBtn.textContent = '\u2715';
        rmBtn.title = 'Remover arquivo';
        rmBtn.addEventListener('click', () => {
            sources.splice(index, 1);
            renderFileRows();
            processBtn.disabled = sources.length === 0;
            resetResults();
            runConversion();
        });
        header.appendChild(name);
        header.appendChild(rmBtn);

        const field = document.createElement('div');
        field.className = 'field';
        const lbl = document.createElement('label');
        lbl.textContent = 'Horários Disponíveis';
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = '10,12,13';
        field.appendChild(lbl);
        field.appendChild(input);
        source.input = input;

        let debounce;
        input.addEventListener('input', () => {
            clearTimeout(debounce);
            debounce = setTimeout(() => { if (sources.length) runConversion(); }, 250);
        });

        row.appendChild(header);
        row.appendChild(field);
        fileRowsContainer.appendChild(row);
    });
}

function resetResults() {
    resultData = [];
    fileSummaries = [];
    dlCsvBtn.disabled = true;
    previewContainer.innerHTML = '<div class="empty">Carregue um ou mais CSVs para visualizar a prévia.</div>';
    summary.textContent = '';
}

function normHeader(h) {
    return h.toUpperCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

function detectLocation(raw) {
    const upper = String(raw || '').toUpperCase();
    for (const [location, config] of Object.entries(LOCATION_CONFIG)) {
        if (config.codes.some(code => upper.includes(code))) return location;
    }
    return String(raw || '').trim();
}

function detectEspecialidade(raw) {
    const upper = String(raw || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    for (const [specialty, config] of Object.entries(SPECIALTY_CONFIG)) {
        if (config.keywords.some(kw => upper.includes(kw))) return specialty;
    }
    return String(raw || '').trim();
}

async function runConversion() {
    if (!sources.length) return;
    const dateVal = refDateInput.value;
    if (!dateVal) { showStatus('Defina a Data do Evento.', 'error'); return; }

    const token = ++conversionToken;
    const combined = [];
    const summaries = [];

    for (const source of sources) {
        let text;
        try {
            text = await source.file.text();
        } catch (e) {
            continue;
        }
        if (token !== conversionToken) return;

        const parsed = parseCSVFile(text);
        if (parsed.error) {
            showStatus(`Arquivo "${source.file.name}": ${parsed.error}`, 'error');
            return;
        }
        const rows = buildImportRows(parsed.rows, parseGroupNames(source.input), dateVal);
        combined.push(...rows);
        summaries.push({ name: source.file.name, count: rows.length });
    }

    if (token !== conversionToken) return;
    if (!combined.length) { showStatus('Nenhum registro válido encontrado.', 'error'); return; }

    resultData = combined;
    fileSummaries = summaries;
    renderPreview(combined, summaries);
    dlCsvBtn.disabled = false;
    showStatus(`${combined.length} registros convertidos.`, 'success');
}

function parseCSVFile(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(Boolean);
    if (lines.length < 2) return { error: 'CSV deve ter cabeçalho e ao menos uma linha.' };

    const sep = (lines[0].match(/;/g) || []).length > (lines[0].match(/,/g) || []).length ? ';' : ',';
    const headers = parseCSVLine(lines[0], sep).map(normHeader);
    const idxPaciente = headers.findIndex(h => h.replace(/[^A-Z0-9]/g, '') === 'PACIENTE');
    const idxTelefone = headers.findIndex(h => h.replace(/[^A-Z0-9]/g, '') === 'TELEFONE');
    const idxHorario = headers.findIndex(h => h.replace(/[^A-Z0-9]/g, '') === 'HORARIO');
    const idxUnidade = headers.findIndex(h => h.replace(/[^A-Z0-9]/g, '') === 'UNIDADE');
    const idxEspecialidade = headers.findIndex(h => h.replace(/[^A-Z0-9]/g, '') === 'ESPECIALIDADE');
    if (idxPaciente === -1) return { error: `Coluna "Paciente" não encontrada. Cabeçalho lido: ${headers.join(', ')}` };
    if (idxTelefone === -1) return { error: 'Coluna "Telefone" não encontrada.' };
    if (idxHorario === -1) return { error: 'Coluna "Horário" não encontrada.' };
    if (idxUnidade === -1) return { error: 'Coluna "Unidade" não encontrada.' };
    if (idxEspecialidade === -1) return { error: 'Coluna "Especialidade" não encontrada.' };

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
        const vals = parseCSVLine(lines[i], sep);
        if (vals.length < headers.length) continue;
        const paciente = vals[idxPaciente].trim();
        if (!paciente) continue;
        rows.push({
            paciente,
            telefone: vals[idxTelefone],
            horario: vals[idxHorario],
            unidade: vals[idxUnidade],
            especialidade: vals[idxEspecialidade]
        });
    }
    return { rows };
}

function buildImportRows(parsedRows, groupNames, dateVal) {
    const result = [];
    parsedRows.forEach(row => {
        const phones = extractPhones(row.telefone);
        if (!phones.length) return;

        const targetIdx = phones.findIndex(p => {
            const d = p.replace(/\D/g, '').substring(2);
            return d.length === 9 && d.startsWith('9');
        });
        const chosenPhone = targetIdx !== -1 ? phones[targetIdx] : phones[0];
        const remaining = phones.filter((_, i) => i !== targetIdx).join(', ');

        const especialidade = detectEspecialidade(row.especialidade);
        const unidade = detectLocation(row.unidade);

        const tags = [dateVal, 'Automação'];
        if (especialidade) tags.push(especialidade);
        if (unidade) tags.push(unidade);

        const hour = parseHour(row.horario);
        if (hour) tags.push(`Consulta${hour}h`);

        result.push({
            Nome: row.paciente,
            Telefone: chosenPhone,
            Etiquetas: tags.join(', '),
            NotasInternas: remaining ? `Outros telefones: ${remaining}` : ''
        });
    });
    applyGrouping(result, groupNames);
    return result;
}

function applyGrouping(rows, rawNames) {
    if (rawNames.length === 0 || rawNames.length > rows.length) return;

    const groupSize = Math.ceil(rows.length / rawNames.length);
    rows.forEach((row, index) => {
        const groupIndex = Math.floor(index / groupSize);
        const tag = formatGroupTag(rawNames[groupIndex]);
        const etq = row.Etiquetas || '';
        const regex = /,\s*Consulta[^,]*/;
        if (regex.test(etq)) {
            row.Etiquetas = etq.replace(regex, `, ${tag}`);
        } else {
            row.Etiquetas = etq ? `${etq}, ${tag}` : tag;
        }
    });
}

function formatGroupTag(name) {
    if (/^\d+$/.test(name)) return `Consulta${name.padStart(2, '0')}h`;
    return 'Consulta' + name.charAt(0).toUpperCase() + name.slice(1).toLowerCase();
}

function parseHour(raw) {
    const m = String(raw || '').match(/(\d{1,2})[:hH]/);
    if (!m) return null;
    return m[1].padStart(2, '0');
}

function renderPreview(data, summaries) {
    previewContainer.innerHTML = '';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['Nome', 'Telefone', 'Etiquetas', 'Notas Internas'].forEach(t => {
        const th = document.createElement('th'); th.textContent = t; hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    data.slice(0, 5).forEach(row => {
        const tr = document.createElement('tr');
        [row.Nome, row.Telefone, row.Etiquetas, row.NotasInternas || '—'].forEach(v => {
            const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    previewContainer.appendChild(table);

    const parts = summaries.map(s => `${s.count} · ${s.name}`);
    const shownSuffix = data.length > 5 ? ` · exibindo 5 de ${data.length}` : '';
    summary.textContent = `${data.length} registros no total${shownSuffix}${parts.length ? ' — ' + parts.join(' | ') : ''}`;
}

dlCsvBtn.addEventListener('click', () => {
    const headers = ['Nome', 'Telefone', 'Etiquetas', 'Notas Internas'];
    const fieldMap = { 'Notas Internas': 'NotasInternas' };
    const csv = generateCSV(resultData, headers, fieldMap);
    const date = refDateInput.value;
    const name = `nao_consultados_${date}_concat.csv`;
    const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    showStatus(`"${name}" baixado!`, 'success');
});

const CRLF = '\r\n';

function escapeField(f) {
    const str = typeof f === 'string' ? f : String(f ?? '');
    return `"${str.replace(/"/g, '""')}"`;
}

function generateCSV(data, headers, fieldMap) {
    if (!data.length) return '';
    const rows = [headers.join(',')];
    data.forEach(row => {
        rows.push(headers.map(h => escapeField(fieldMap ? row[fieldMap[h] || h] : row[h])).join(','));
    });
    return rows.join(CRLF);
}

function extractPhones(phoneStr) {
    if (!phoneStr) return [];
    const regex = /(?:\(?\d{2}\)?\s?\d{4,5}-?\d{4})/g;
    const matches = phoneStr.match(regex) || [];
    return matches.map(num => {
        const cleaned = num.replace(/\D/g, '');
        if (cleaned.length === 11) {
            return `(${cleaned.substring(0, 2)}) ${cleaned.substring(2, 7)}-${cleaned.substring(7)}`;
        } else if (cleaned.length === 10) {
            return `(${cleaned.substring(0, 2)}) ${cleaned.substring(2, 6)}-${cleaned.substring(6)}`;
        }
        return num.trim();
    });
}

function parseCSVLine(line, sep = ',') {
    const result = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQ) {
            if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
            else if (c === '"') inQ = false;
            else cur += c;
        } else {
            if (c === '"') inQ = true;
            else if (c === sep) { result.push(cur); cur = ''; }
            else cur += c;
        }
    }
    result.push(cur);
    return result;
}

function showStatus(text, type) {
    clearTimeout(statusTimeout);
    statusEl.textContent = text;
    statusEl.className = 'status';
    if (type) statusEl.classList.add('status-' + type);
    statusTimeout = setTimeout(() => {
        if (statusEl.textContent === text) { statusEl.textContent = ''; statusEl.className = 'status'; }
    }, 4000);
}
</script>
</body>
</html>
