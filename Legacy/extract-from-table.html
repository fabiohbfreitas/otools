<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Table to CSV Converter</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #121212;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #2e2e2e;
            --border-focus: #ffffff;
            --button-bg: #ffffff;
            --button-text: #000000;
            --button-hover: #e5e5e5;
            --button-sec-bg: #1a1a1a;
            --button-sec-text: #ffffff;
            --button-sec-hover: #2a2a2a;
            --feedback-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2.5rem 1rem;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2.5rem;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        textarea {
            width: 100%;
            height: 320px;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-main);
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.85rem;
            padding: 0.75rem;
            resize: vertical;
            outline: none;
            transition: border-color 0.15s ease;
        }

        textarea:focus {
            border-color: var(--border-focus);
        }

        /* Configurations bar */
        .config-bar {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 600px) {
            .config-bar {
                flex-direction: row;
                align-items: center;
                gap: 1.5rem;
            }
        }

        .config-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            flex-grow: 1;
        }

        .config-group label {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .config-input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.5rem 0.75rem;
        }

        .config-input-wrapper:focus-within {
            border-color: var(--border-focus);
        }

        .config-input-wrapper input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            font-size: 0.9rem;
            width: 100%;
        }

        .config-input-wrapper span {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-left: 0.25rem;
            user-select: none;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: 1px solid var(--button-bg);
            border-radius: 4px;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: var(--button-hover);
            border-color: var(--button-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: var(--button-sec-bg);
            border: 1px solid var(--border);
            color: var(--button-sec-text);
        }

        button.secondary:hover {
            background-color: var(--button-sec-hover);
            border-color: var(--text-muted);
        }

        button:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Success and feedback alerts */
        .status-container {
            text-align: center;
            min-height: 1.5rem;
        }

        .status {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--feedback-color);
            border-bottom: 1px dashed transparent;
            display: inline-block;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>HTML Table to CSV Converter</h1>
        <p>A minimalist developer tool to extract sanitized tables. Cleaned of structural formatting anomalies.</p>
    </header>

    <!-- Configuration Options -->
    <div class="config-bar">
        <div class="config-group">
            <label for="fileNameInput">Export File Name</label>
            <div class="config-input-wrapper">
                <input id="fileNameInput" type="text" value="exported_table" placeholder="exported_table" spellcheck="false">
                <span>.csv</span>
            </div>
        </div>
    </div>

    <div class="grid">
        <!-- Input Card -->
        <div class="card">
            <div class="card-title">HTML Input</div>
            <textarea id="htmlInput" placeholder="Paste your HTML here (e.g., <table>...</table>)"></textarea>
            <div class="actions">
                <button id="convertBtn">Convert Table</button>
                <button id="clearBtn" class="secondary">Clear</button>
            </div>
        </div>

        <!-- Output Card -->
        <div class="card">
            <div class="card-title">CSV Output</div>
            <textarea id="csvOutput" readonly placeholder="Your formatted CSV will appear here..."></textarea>
            <div class="actions">
                <button id="copyBtn" disabled>Copy to Clipboard</button>
                <button id="downloadBtn" class="secondary" disabled>Download .csv</button>
            </div>
        </div>
    </div>
    
    <div class="status-container">
        <span id="status" class="status"></span>
    </div>
</div>

<script>
    const htmlInput = document.getElementById('htmlInput');
    const csvOutput = document.getElementById('csvOutput');
    const convertBtn = document.getElementById('convertBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const fileNameInput = document.getElementById('fileNameInput');
    const statusMsg = document.getElementById('status');

    // Cleanses cell contents of commas and formatting breaks to protect importer parsers
    function sanitizeAndEscape(val) {
        let text = val.trim();
        
        // 1. Strip out commas to prevent delimiter confusion in Excel
        text = text.replace(/,/g, ''); 
        
        // 2. Collapse all whitespaces, tabs, and newlines into a single space
        text = text.replace(/\s+/g, ' '); 

        // 3. Handle double quotes safely (RFC 4180 standard)
        if (text.includes('"')) {
            text = text.replace(/"/g, '""'); // Double up internal quotes
            return `"${text}"`;
        }
        
        return text;
    }

    function showStatus(text) {
        statusMsg.textContent = text;
        setTimeout(() => {
            if (statusMsg.textContent === text) {
                statusMsg.textContent = '';
            }
        }, 4000);
    }

    function convertTableToCSV() {
        const rawHTML = htmlInput.value.trim();
        if (!rawHTML) {
            showStatus("Please paste some HTML first.");
            return;
        }

        try {
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHTML, 'text/html');
            const table = doc.querySelector('table');

            if (!table) {
                showStatus("No <table> element found in the provided HTML.");
                csvOutput.value = "";
                toggleActionButtons(false);
                return;
            }

            const rows = table.querySelectorAll('tr');
            const csvRows = [];

            rows.forEach(row => {
                // Target both headers (th) and data (td)
                const cells = row.querySelectorAll('th, td');
                if (cells.length === 0) return; // Skip empty rows

                // Cleanse and sanitize every header/data cell
                const rowData = Array.from(cells).map(cell => sanitizeAndEscape(cell.textContent));
                csvRows.push(rowData.join(','));
            });

            if (csvRows.length === 0) {
                showStatus("Table found, but no parseable data rows were detected.");
                return;
            }

            csvOutput.value = csvRows.join('\r\n');
            showStatus("Successfully converted and sanitized!");
            toggleActionButtons(true);
        } catch (err) {
            showStatus("Parsing error: " + err.message);
        }
    }

    function toggleActionButtons(enable) {
        copyBtn.disabled = !enable;
        downloadBtn.disabled = !enable;
    }

    // Event Listeners
    convertBtn.addEventListener('click', convertTableToCSV);

    clearBtn.addEventListener('click', () => {
        htmlInput.value = '';
        csvOutput.value = '';
        toggleActionButtons(false);
        showStatus('');
    });

    copyBtn.addEventListener('click', () => {
        if (!csvOutput.value) return;
        navigator.clipboard.writeText(csvOutput.value)
            .then(() => showStatus("Copied to clipboard!"))
            .catch(() => showStatus("Failed to copy. Check browser permissions."));
    });

    downloadBtn.addEventListener('click', () => {
        if (!csvOutput.value) return;

        // Fetch user defined file name, default back if left empty
        let rawFileName = fileNameInput.value.trim().replace(/[^a-zA-Z0-9_\-]/g, '');
        if (!rawFileName) {
            rawFileName = 'exported_table';
        }

        const blob = new Blob([csvOutput.value], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        link.setAttribute('href', url);
        link.setAttribute('download', `${rawFileName}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showStatus(`Downloaded "${rawFileName}.csv"`);
    });
</script>
</body>
</html>
