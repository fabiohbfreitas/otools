<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Conversor de Exames MaisSaúde</title>
<style>
:root {
    --bg: #0a0a0a; --card: #121212; --border: #262626; --border-focus: #fff;
    --text: #e5e5e5; --muted: #a3a3a3; --accent: #fff; --dim: #f5f5f5;
    --sec-bg: #1a1a1a; --sec-hover: #2a2a2a; --success: #4ade80; --error: #f87171;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5;
    width: 520px; margin: 2rem auto; padding: 1rem;
}
h1 { font-size: 1.1rem; font-weight: 700; color: var(--accent); margin-bottom: 1rem; }
.card {
    background: var(--card); border: 1px solid var(--border); border-radius: 6px;
    padding: 1rem; display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1rem;
}
.field { display: flex; flex-direction: column; gap: .35rem; }
label { font-size: .65rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
input {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: .4rem; font-family: inherit; font-size: .8rem; border-radius: 4px;
    outline: none; width: 100%;
}
input:focus { border-color: var(--border-focus); }
button {
    background: var(--accent); color: var(--bg); border: 1px solid var(--accent);
    border-radius: 4px; padding: .4rem .8rem; font-weight: 600; font-size: .75rem;
    cursor: pointer; transition: background .15s, border-color .15s;
}
button:hover:not(:disabled) { background: var(--dim); border-color: var(--dim); }
button:disabled { opacity: .25; cursor: not-allowed; }
button.sec { background: var(--sec-bg); border-color: var(--border); color: var(--text); }
button.sec:hover:not(:disabled) { background: var(--sec-hover); border-color: var(--muted); }
.wrap { overflow-x: auto; max-height: 200px; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: .75rem; }
th, td { padding: .5rem .6rem; border-bottom: 1px solid var(--border); }
th { background: rgba(255,255,255,.02); color: var(--text); font-weight: 600; white-space: nowrap; }
.empty { padding: 1.5rem; text-align: center; color: var(--muted); }
.summary { font-size: .75rem; color: var(--muted); text-align: center; }
.status { text-align: center; min-height: 1.25rem; font-size: .8rem; font-weight: 500; }
.status-success { color: var(--success); }
.status-error { color: var(--error); }
</style>
</head>
<body>

<h1>Conversor de Exames MaisSaúde</h1>

<div class="card">
    <div class="field">
        <label for="csvFile">Arquivo CSV (Nome, Telefone, Exame/Lista, ..., Data do evento)</label>
        <input type="file" id="csvFile" accept=".csv">
    </div>
    <div class="field">
        <label>Data do Evento (extraída do CSV)</label>
        <input type="text" id="extractedDate" readonly placeholder="Aguardando arquivo...">
    </div>
    <button id="processBtn" class="sec" disabled>Converter</button>
</div>

<div class="card">
    <div class="wrap" id="previewContainer">
        <div class="empty">Carregue um CSV para visualizar a prévia.</div>
    </div>
    <div class="summary" id="summary"></div>
</div>

<div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap">
    <button id="dlCsvBtn" class="sec" disabled>CSV</button>
    <button id="dlGroupedBtn" class="sec" disabled>CSV por Especialidade</button>
</div>

<div class="status" id="status"></div>

<script>
const NORM_MAP = {
    'CARDIOLOGIA': 'Cardiologia',
    'ELETROCARDIOGRAMA': 'Eletrocardiograma',
    'TOMOGRAFIA': 'Tomografia',
    'OTORRINOLARINGOLOGIA': 'Otorrinolaringologia',
    'REUMATOLOGIA': 'Reumatologia',
    'ESPIROMETRIA': 'Espirometria',
    'RESSONANCIA MAGNETICA': 'RessonanciaMagnetica',
    'MAMOGRAFIA': 'Mamografia',
    'CERTO DIAGNOSTICO LABORATORIAL': 'ExameLaboratorial',
    'LABORATORIO FLEMING': 'ExameLaboratorial',
    'LABORATORIO LABIN-MED': 'ExameLaboratorial',
    'LABORMED MEDICINA DIAGNOSTICA': 'ExameLaboratorial',
};

let resultData = [];
let statusTimeout;

const csvFile = document.getElementById('csvFile');
const extractedDate = document.getElementById('extractedDate');
const processBtn = document.getElementById('processBtn');
const previewContainer = document.getElementById('previewContainer');
const summary = document.getElementById('summary');
const dlCsvBtn = document.getElementById('dlCsvBtn');
const dlGroupedBtn = document.getElementById('dlGroupedBtn');
const statusEl = document.getElementById('status');

csvFile.addEventListener('change', () => {
    processBtn.disabled = !csvFile.files.length;
});

processBtn.addEventListener('click', () => {
    const file = csvFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => processCSV(e.target.result);
    reader.readAsText(file, 'UTF-8');
});

function normalizeEspecialidade(raw) {
    const key = raw.toUpperCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    return NORM_MAP[key] || raw.trim().replace(/\b\w/g, c => c.toUpperCase());
}

function processCSV(text) {
    const lines = text.split(/\r?\n/).filter(Boolean);
    if (lines.length < 2) { showStatus('CSV deve ter cabeçalho e ao menos uma linha.', 'error'); return; }

    const headers = parseCSVLine(lines[0]).map(h => h.trim().toUpperCase());
    const idxNome = headers.findIndex(h => h === 'NOME');
    const idxTelefone = headers.findIndex(h => h === 'TELEFONE');
    const idxExame = headers.findIndex(h => h === 'EXAME/LISTA');
    const idxData = headers.findIndex(h => h === 'DATA DO EVENTO');
    if (idxNome === -1) { showStatus('Coluna "Nome" não encontrada.', 'error'); return; }
    if (idxTelefone === -1) { showStatus('Coluna "Telefone" não encontrada.', 'error'); return; }
    if (idxExame === -1) { showStatus('Coluna "Exame/Lista" não encontrada.', 'error'); return; }
    if (idxData === -1) { showStatus('Coluna "Data do evento" não encontrada.', 'error'); return; }

    const firstDataRow = parseCSVLine(lines[1]);
    const rawDate = (firstDataRow[idxData] || '').trim();
    const dateMatch = rawDate.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (!dateMatch) { showStatus('Formato de data inválido em "Data do evento".', 'error'); return; }
    const month = dateMatch[1].padStart(2, '0');
    const day = dateMatch[2].padStart(2, '0');
    const dateVal = `${dateMatch[3]}-${month}-${day}`;
    extractedDate.value = rawDate;

    resultData = [];
    for (let i = 1; i < lines.length; i++) {
        const vals = parseCSVLine(lines[i]);
        if (vals.length < headers.length) continue;
        const nome = vals[idxNome].trim();
        const telefoneRaw = vals[idxTelefone].trim();
        if (!nome && !telefoneRaw) continue;

        const phones = extractPhones(telefoneRaw);
        if (!phones.length) continue;

        const targetIdx = phones.findIndex(p => {
            const d = p.replace(/\D/g, '').substring(2);
            return d.length === 9 && d.startsWith('9');
        });
        const chosenPhone = targetIdx !== -1 ? phones[targetIdx] : phones[0];
        const remaining = phones.filter((_, i) => i !== targetIdx).join(', ');

        const rawExame = vals[idxExame].trim();
        const especialidade = normalizeEspecialidade(rawExame);
        const etiquetas = [dateVal, 'Automação', 'Convocacao', 'MaisSaude', especialidade].join(', ');

        resultData.push({
            Nome: nome,
            Telefone: chosenPhone,
            Etiquetas: etiquetas,
            NotasInternas: remaining ? `Outros telefones: ${remaining}` : '',
            _especialidade: especialidade
        });
    }

    const merged = {};
    resultData.forEach(row => {
        const key = row.Nome.toLowerCase().trim();
        if (!key) return;
        if (!merged[key]) {
            merged[key] = {
                Nome: row.Nome,
                Telefone: row.Telefone,
                remainingPhones: '',
                especialidades: new Set()
            };
        }
        const m = merged[key];
        if (row._especialidade) m.especialidades.add(row._especialidade);
        if (!m.Telefone && row.Telefone) m.Telefone = row.Telefone;
        if (row.NotasInternas) {
            const phones = row.NotasInternas.replace(/^Outros telefones:\s*/, '');
            m.remainingPhones = m.remainingPhones
                ? `${m.remainingPhones}, ${phones}`
                : phones;
        }
    });

    resultData = Object.values(merged).map(m => {
        const espList = Array.from(m.especialidades).sort();
        const etiquetas = [dateVal, 'Automação', 'Convocacao', 'MaisSaude', ...espList].join(', ');
        return {
            Nome: m.Nome,
            Telefone: m.Telefone,
            Etiquetas: etiquetas,
            NotasInternas: m.remainingPhones ? `Outros telefones: ${m.remainingPhones}` : '',
            _especialidade: espList
        };
    });

    if (!resultData.length) { showStatus('Nenhum registro válido encontrado.', 'error'); return; }

    renderPreview(resultData);
    dlCsvBtn.disabled = false;
    dlGroupedBtn.disabled = false;
    showStatus(`${resultData.length} registros convertidos.`, 'success');
}

function renderPreview(data) {
    previewContainer.innerHTML = '';
    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    ['Nome', 'Telefone', 'Etiquetas', 'Notas Internas'].forEach(t => {
        const th = document.createElement('th'); th.textContent = t; hr.appendChild(th);
    });
    thead.appendChild(hr);
    table.appendChild(thead);
    const tbody = document.createElement('tbody');
    data.slice(0, 5).forEach(row => {
        const tr = document.createElement('tr');
        [row.Nome, row.Telefone, row.Etiquetas, row.NotasInternas || '—'].forEach(v => {
            const td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    previewContainer.appendChild(table);
    summary.textContent = `${data.length} registros · exibindo 5`;
}

dlCsvBtn.addEventListener('click', () => {
    const headers = ['Nome', 'Telefone', 'Etiquetas', 'Notas Internas'];
    const fieldMap = { 'Notas Internas': 'NotasInternas' };
    const csv = generateCSV(resultData, headers, fieldMap);
    const name = `maissaude_${extractedDate.value.replace(/\//g, '-')}.csv`;
    const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    showStatus(`"${name}" baixado!`, 'success');
});

dlGroupedBtn.addEventListener('click', () => {
    const grupos = {};
    resultData.forEach(row => {
        const espList = Array.isArray(row._especialidade) ? row._especialidade : [row._especialidade || 'SemEspecialidade'];
        espList.forEach(esp => {
            if (!grupos[esp]) grupos[esp] = [];
            grupos[esp].push(row);
        });
    });
    const dateStr = extractedDate.value.replace(/\//g, '-');
    const headers = ['Nome', 'Telefone', 'Etiquetas', 'Notas Internas'];
    const fieldMap = { 'Notas Internas': 'NotasInternas' };
    const espList = Object.keys(grupos).sort();
    espList.forEach((esp, idx) => {
        setTimeout(() => {
            const csv = generateCSV(grupos[esp], headers, fieldMap);
            const safeName = esp.replace(/[^a-zA-Z0-9_\-]/g, '');
            const name = `maissaude_${safeName}_${dateStr}.csv`;
            const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = name; a.click();
            URL.revokeObjectURL(url);
            if (idx === espList.length - 1) {
                showStatus(`${espList.length} arquivos baixados por especialidade.`, 'success');
            }
        }, idx * 500);
    });
});

const CRLF = '\r\n';

function escapeField(f) {
    const str = typeof f === 'string' ? f : String(f ?? '');
    return `"${str.replace(/"/g, '""')}"`;
}

function generateCSV(data, headers, fieldMap) {
    if (!data.length) return '';
    const rows = [headers.join(',')];
    data.forEach(row => {
        rows.push(headers.map(h => escapeField(fieldMap ? row[fieldMap[h] || h] : row[h])).join(','));
    });
    return rows.join(CRLF);
}

function extractPhones(phoneStr) {
    if (!phoneStr) return [];
    const results = [];
    const parts = phoneStr.split(/[/,:|]/).map(s => s.trim()).filter(Boolean);
    for (const part of parts) {
        let digits = part.replace(/\D/g, '');
        if (!digits) continue;
        if (digits.startsWith('55') && digits.length > 11) {
            digits = digits.slice(2);
        }
        if (digits.length === 12) {
            results.push(`(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`);
        } else if (digits.length === 11) {
            results.push(`(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`);
        } else if (digits.length === 10) {
            results.push(`(${digits.slice(0,2)}) ${digits.slice(2,6)}-${digits.slice(6)}`);
        } else if (digits.length === 9) {
            results.push(`${digits.slice(0,5)}-${digits.slice(5)}`);
        } else if (digits.length === 8) {
            results.push(`${digits.slice(0,4)}-${digits.slice(4)}`);
        }
    }
    return results;
}

function parseCSVLine(line) {
    const result = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQ) {
            if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
            else if (c === '"') inQ = false;
            else cur += c;
        } else {
            if (c === '"') inQ = true;
            else if (c === ',') { result.push(cur); cur = ''; }
            else cur += c;
        }
    }
    result.push(cur);
    return result;
}

function showStatus(text, type) {
    clearTimeout(statusTimeout);
    statusEl.textContent = text;
    statusEl.className = 'status';
    if (type) statusEl.classList.add('status-' + type);
    statusTimeout = setTimeout(() => {
        if (statusEl.textContent === text) { statusEl.textContent = ''; statusEl.className = 'status'; }
    }, 4000);
}
</script>
</body>
</html>
